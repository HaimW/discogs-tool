[package]
name = "analyzer-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Command-line front end: plans, downloads, analyses and exports a collection's BPM/key data."

# A library as well as a binary so the end-to-end test can drive the whole run
# with stub download/analysis steps instead of hitting YouTube.
build = "build.rs"

[lib]
name = "analyzer_cli"
path = "src/lib.rs"

[[bin]]
name = "discogs-analyzer"
path = "src/main.rs"

[dependencies]
analyzer-core = { path = "../core" }
analyzer-analysis = { path = "../analysis" }
analyzer-download = { path = "../download" }
clap = { version = "4", features = ["derive"] }
ctrlc = "3"
# The local UI serves JSON to a page it also serves. No HTTP crate and no async
# runtime: the server is a hundred lines of std::net in `ui/`, because the whole
# point of this tool is that it is one binary you can hand to someone.
serde_json.workspace = true
serde.workspace = true

[dev-dependencies]
serde_json.workspace = true
