<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vinyl Collection Player</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>
<body>
    <nav class="top-nav">
        <a href="#" class="nav-brand" onclick="navigate('collection'); return false;">
            <span class="vinyl-icon">&#9898;</span>
            Vinyl Collection Player
        </a>
        <div class="nav-links">
            <a href="#" class="nav-link" onclick="navigate('collection'); return false;">Collection</a>
            <a href="#" class="nav-link" onclick="navigate('tracks'); return false;">Tracks</a>
            <a href="#" class="nav-link" onclick="navigate('setlists'); return false;">Setlists</a>
            <a href="#" class="nav-link" onclick="navigate('backup'); return false;">Backup</a>
        </div>
        <div class="nav-actions">
            <button class="btn btn-sync" id="sync-btn" onclick="startSync()">
                <span class="sync-icon">&#8635;</span>
                Sync Collection
            </button>
        </div>
    </nav>

    <div id="sync-banner" class="sync-banner" style="display:none;">
        <span class="sync-spinner">&#9676;</span>
        <span id="sync-message">Syncing...</span>
    </div>

    <main class="content" id="app">
        <!-- SPA content rendered here by app.js -->
    </main>

    <!-- Now Playing Bar -->
    <div id="now-playing" class="now-playing" style="display:none;">
        <div class="np-info">
            <img id="np-cover" class="np-cover" src="" alt="">
            <div class="np-text">
                <div id="np-title" class="np-title">No track selected</div>
                <div id="np-artist" class="np-artist"></div>
            </div>
        </div>
        <div class="np-visualizer" id="np-visualizer">
            <canvas id="viz-canvas" width="360" height="120"></canvas>
            <div class="viz-switcher">
                <button class="viz-btn active" data-viz="bars"      title="Spectrum Bars">▰▰▰</button>
                <button class="viz-btn"        data-viz="wave"      title="Plasma Wave">∿</button>
                <button class="viz-btn"        data-viz="particles" title="Starfield">✦</button>
                <button class="viz-btn"        data-viz="rings"     title="Pulse Rings">◎</button>
                <button class="viz-btn"        data-viz="aurora"    title="Aurora Borealis">≋</button>
                <button class="viz-btn"        data-viz="helix"     title="DNA Helix">⌇</button>
                <button class="viz-btn"        data-viz="lissajous" title="Lissajous">∞</button>
                <button class="viz-btn"        data-viz="tunnel"    title="Neon Tunnel">⊡</button>
            </div>
        </div>
        <div class="np-player">
            <div id="player-container"></div>
            <div id="player2-container" style="position:absolute;left:-9999px;top:-9999px;width:1px;height:1px;overflow:hidden;" aria-hidden="true"></div>
        </div>
        <div class="np-controls">
            <div class="np-transport">
                <button id="np-prev"       class="np-btn np-btn-skip" title="Previous track">&#9664;&#9664;</button>
                <button id="np-play-pause" class="np-btn np-btn-main" title="Play / Pause">&#9654;</button>
                <button id="np-next"       class="np-btn np-btn-skip" title="Next track">&#9654;&#9654;</button>
            </div>
            <div class="np-actions">
                <button id="np-queue"        class="np-btn" title="Queue">&#9776;</button>
                <button id="np-add-setlist"  class="np-btn" title="Save to setlist">&#9733;</button>
                <button id="np-goto-release" class="np-btn np-btn-icon" title="Go to release page">&#8599;</button>
                <button id="np-suggest"      class="np-btn" title="Suggest next track">&#8764;</button>
                <button id="np-cf-toggle"    class="np-btn" title="Toggle crossfade">CF: OFF</button>
                <input id="np-cf-seconds" class="np-cf-input" type="number" min="1" max="30" value="5" title="Crossfade duration (sec)" style="display:none;">
                <button id="np-close"        class="np-btn np-btn-close" title="Stop playback">&times;</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
