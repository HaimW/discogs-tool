<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vinyl Collection Player</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="bg-layer" aria-hidden="true">
        <!-- 3.3 MB: loaded by the script at the end of <body> once the page is
             ready, and not at all when turned off (P6). -->
        <video data-src="A_dark_atmospheric_digital_ar.mp4" loop muted playsinline preload="none" id="bg-video"></video>
    </div>
    <nav class="top-nav">
        <a href="#" class="nav-brand" id="nav-brand" data-nav="collection">
            <span class="vinyl-icon">&#9898;</span>
            Vinyl Collection Player
        </a>
        <div class="nav-links">
            <a href="#" class="nav-link" data-nav="collection">Collection</a>
            <a href="#" class="nav-link" data-nav="tracks">Tracks</a>
            <a href="#" class="nav-link" data-nav="wantlist">Want List <span id="notif-badge" class="notif-nav-badge" style="display:none;">0</span></a>
            <a href="#" class="nav-link" data-nav="setlists">Setlists</a>
            <a href="#" class="nav-link" data-nav="store">Store</a>
            <a href="#" class="nav-link" data-nav="stats">Stats</a>
            <a href="#" class="nav-link" data-nav="backup">Backup</a>
            <a href="#" class="nav-link" data-nav="analyzer">Analyzer</a>
        </div>
        <div class="nav-actions">
            <button class="btn btn-sync" id="sync-btn">
                <span class="sync-icon">&#8635;</span>
                Sync Collection
            </button>
            <button class="btn btn-notif" id="notif-bell-btn" title="Marketplace alerts">&#128276;</button>
            <button class="btn btn-bg-toggle" id="bg-toggle-btn" title="Toggle background video">&#9646;&#9646;</button>
        </div>
    </nav>

    <div id="sync-banner" class="sync-banner" style="display:none;">
        <span class="sync-spinner">&#9676;</span>
        <span id="sync-message">Syncing...</span>
    </div>

    <main class="content" id="app">
        <!-- SPA content rendered here by app.js -->
    </main>

    <!-- Footer Credit -->
    <div class="footer-credit-wrap">
        <a id="footer-credit-link" class="footer-credit-link" href="https://github.com/HaimW" target="_blank" rel="noopener noreferrer">
            Built By Haim Yafim
        </a>
    </div>

    <!-- Now Playing Bar -->
    <div id="now-playing" class="now-playing" style="display:none;">
        <!-- Audio-only YouTube players (off-screen) -->
        <div id="player-container"  style="position:absolute;left:-9999px;top:-9999px;width:1px;height:1px;overflow:hidden;" aria-hidden="true"></div>
        <div id="player2-container" style="position:absolute;left:-9999px;top:-9999px;width:1px;height:1px;overflow:hidden;" aria-hidden="true"></div>

        <!-- Visualizer overlay (toggle with ≋ button) -->
        <div class="np-visualizer" id="np-visualizer" style="display:none;">
            <canvas id="viz-canvas" width="400" height="160"></canvas>
            <div class="viz-switcher">
                <button class="viz-btn active" data-viz="bars"      title="Spectrum Bars">▰▰▰</button>
                <button class="viz-btn"        data-viz="wave"      title="Plasma Wave">∿</button>
                <button class="viz-btn"        data-viz="particles" title="Starfield">✦</button>
                <button class="viz-btn"        data-viz="rings"     title="Pulse Rings">◎</button>
                <button class="viz-btn"        data-viz="aurora"    title="Aurora Borealis">≋</button>
                <button class="viz-btn"        data-viz="helix"     title="DNA Helix">⌇</button>
                <button class="viz-btn"        data-viz="lissajous" title="Lissajous">∞</button>
                <button class="viz-btn"        data-viz="tunnel"    title="Neon Tunnel">⊡</button>
            </div>
        </div>

        <!-- Seekable progress bar -->
        <div class="np-progress-track" id="np-progress-track" title="Click to seek">
            <div class="np-progress-fill" id="np-progress-fill"></div>
        </div>

        <!-- Main bar row: info | transport | actions -->
        <div class="np-main-row">
            <div class="np-info">
                <img id="np-cover" class="np-cover" src="" alt="">
                <div class="np-text">
                    <div id="np-title" class="np-title">No track selected</div>
                    <div id="np-artist" class="np-artist"></div>
                </div>
            </div>

            <div class="np-center">
                <div class="np-transport">
                    <button id="np-prev"       class="np-btn np-btn-skip" title="Previous track">&#9664;&#9664;</button>
                    <button id="np-play-pause" class="np-btn np-btn-main" title="Play / Pause">&#9654;</button>
                    <button id="np-next"       class="np-btn np-btn-skip" title="Next track">&#9654;&#9654;</button>
                </div>
                <div id="np-time" class="np-time">0:00 / 0:00</div>
            </div>

            <div class="np-right">
                <div class="np-volume">
                    <button id="np-mute" class="np-btn np-btn-mute" type="button" aria-pressed="false" aria-label="Mute" title="Mute">
                        <svg class="np-mute-icon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false">
                            <path fill="currentColor" d="M4 9h4l5-4v14l-5-4H4z"/>
                            <path class="np-vol-waves" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M16 9.5a3.5 3.5 0 0 1 0 5M18.5 7a7 7 0 0 1 0 10"/>
                            <path class="np-vol-x" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M16 9.5l5 5M21 9.5l-5 5"/>
                        </svg>
                    </button>
                    <label for="np-volume" class="sr-only">Volume</label>
                    <input id="np-volume" class="np-volume-slider" type="range" min="0" max="100" step="1" value="100" aria-valuetext="100%">
                </div>
                <div class="np-actions">
                    <button id="np-queue"        class="np-btn" title="Queue">&#9776;</button>
                    <button id="np-add-setlist"  class="np-btn" title="Save to setlist">&#9733;</button>
                    <button id="np-goto-release" class="np-btn np-btn-icon" title="Go to release page">&#8599;</button>
                    <button id="np-suggest"      class="np-btn" title="Suggest next track">&#8764;</button>
                    <button id="np-viz-toggle"   class="np-btn" title="Toggle visualizer">&#8771;</button>
                    <button id="np-cf-toggle"    class="np-btn" title="Toggle crossfade">CF: OFF</button>
                    <input  id="np-cf-seconds"   class="np-cf-input" type="number" min="1" max="30" value="5" title="Crossfade duration (sec)" style="display:none;">
                    <button id="np-close"        class="np-btn np-btn-close" title="Stop playback">&times;</button>
                </div>
            </div>
        </div>
    </div>

    <div id="notif-panel" class="notif-panel"></div>

    <!-- Source modules (load order matters: dependencies first) -->
    <script src="src/utils.js"></script>
    <script src="src/actions.js"></script>
    <script src="src/toast.js"></script>
    <script src="src/db.js"></script>
    <script src="src/meta.js"></script>
    <script src="src/camelot.js"></script>
    <script src="src/config.js"></script>
    <script src="src/api.js"></script>
    <script src="src/router.js"></script>
    <script src="src/visualizer.js"></script>
    <script src="src/video_match.js"></script>
    <script src="src/player.js"></script>
    <script src="src/volume.js"></script>
    <script src="src/crossfade.js"></script>
    <script src="src/player_state.js"></script>
    <script src="src/search.js"></script>
    <script src="src/meta_editor.js"></script>
    <script src="src/harmonic.js"></script>
    <script src="src/queue.js"></script>
    <script src="src/marketplace.js"></script>
    <script src="src/setlists.js"></script>
    <script src="src/backup.js"></script>
    <script src="src/store_serial.js"></script>
    <script src="src/views/store.js"></script>
    <script src="src/views/setup.js"></script>
    <script src="src/views/collection.js"></script>
    <script src="src/views/wantlist_sync.js"></script>
    <script src="src/views/wantlist.js"></script>
    <script src="src/views/tracks.js"></script>
    <script src="src/views/release.js"></script>
    <script src="src/views/analyzer.js"></script>
    <script src="src/views/stats.js"></script>
    <script src="src/init.js"></script>
    <script src="src/footer_credit.js"></script>
    <script>
        // Background video (P6). It costs 3.3 MB, so it loads only after the
        // page has, and never for someone who turned it off (remembered), asks
        // for reduced motion, or has data saving on. The toggle loads it then.
        (function () {
            const bgVideo = document.getElementById('bg-video');
            const bgLayer = document.querySelector('.bg-layer');
            const bgToggleBtn = document.getElementById('bg-toggle-btn');
            const PREF = 'bg-video';

            function wantsVideo() {
                let pref = null;
                try { pref = localStorage.getItem(PREF); } catch (e) {}
                if (pref === 'on') return true;
                if (pref === 'off') return false;
                if (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) return false;
                if (navigator.connection && navigator.connection.saveData) return false;
                return true;
            }
            function applyRate() { try { bgVideo.playbackRate = 0.95; } catch (e) {} }
            function start() {
                if (!bgVideo.getAttribute('src')) {
                    bgVideo.src = bgVideo.dataset.src;
                    bgVideo.addEventListener('loadedmetadata', applyRate, { once: true });
                }
                applyRate();
                const p = bgVideo.play();
                if (p && p.catch) p.catch(function () {});
            }
            let isOnNow = wantsVideo();
            function setOn(isOn) {
                isOnNow = isOn;
                bgLayer.classList.toggle('bg-off', !isOn);
                document.body.style.background = isOn ? '' : '#0a0a0a';
                bgToggleBtn.title = isOn ? 'Disable background video' : 'Enable background video';
                bgToggleBtn.classList.toggle('active', isOn);
                if (isOn) start(); else bgVideo.pause();
            }

            // Hidden until loaded, so nothing flashes; the page's own dark
            // background shows. The button already shows the intended state.
            bgLayer.classList.add('bg-off');
            bgToggleBtn.classList.toggle('active', isOnNow);
            if (isOnNow) {
                const later = window.requestIdleCallback || function (fn) { setTimeout(fn, 200); };
                // Skipped if it was switched off while waiting.
                const go = function () { later(function () { if (isOnNow) setOn(true); }, { timeout: 2000 }); };
                if (document.readyState === 'complete') go(); else window.addEventListener('load', go, { once: true });
            } else {
                setOn(false);
            }

            bgToggleBtn.addEventListener('click', function () {
                const next = !isOnNow;
                try { localStorage.setItem(PREF, next ? 'on' : 'off'); } catch (e) {}
                setOn(next);
            });
        })();
    </script>
</body>
</html>
