name: Web app checks

# Lint and test the web app on every push and pull request. The desktop
# analyzer has its own workflow (analyzer-release.yml) and is not built here.
on:
  push:
    paths-ignore: ['desktop-analyzer/**', 'docs/**', '**/*.md']
  pull_request:
    paths-ignore: ['desktop-analyzer/**', 'docs/**', '**/*.md']

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test

  e2e:
    # Browser smoke tests: the real app in Chromium, network blocked except
    # a faked api.discogs.com. Runs alongside `check`, not after it, so both
    # signals arrive in one round-trip.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The browser revision follows the pinned @playwright/test version.
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: ${{ failure() }}
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
